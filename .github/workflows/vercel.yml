# Déploiement Vercel par GitHub Actions : preview sur chaque PR / branche, production sur main.
# Secrets attendus : VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Alternative sans ce workflow : importer le dépôt dans Vercel (intégration Git native).
name: Vercel
on:
  push:
    branches: ["**"]
  pull_request:
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
jobs:
  deployer:
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g vercel@latest
      - name: Préversion
        if: github.ref != 'refs/heads/main'
        run: |
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Préversion : $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Production
        if: github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Production : $url" >> "$GITHUB_STEP_SUMMARY"
