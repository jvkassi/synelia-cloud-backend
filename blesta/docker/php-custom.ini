; ioncube loader — Blesta ships ~3 license-protected files that need this.
zend_extension=/opt/ioncube/ioncube_loader_lin.so

memory_limit=256M
upload_max_filesize=25M
post_max_size=25M

error_reporting=E_ALL & ~E_DEPRECATED & ~E_NOTICE
display_errors=Off
log_errors=On

; Sessions live on the persistent data volume so they survive container
; restarts/redeploys instead of only a single container's lifetime.
session.save_handler=files
session.save_path=/opt/blesta/data/sessions

expose_php=Off
