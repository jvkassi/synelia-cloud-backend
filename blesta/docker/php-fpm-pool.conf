[www]
user = nobody
group = nobody

listen = /run/php-fpm.sock
listen.owner = nobody
listen.group = nobody
listen.mode = 0660

; Vercel Functions scale per-instance concurrency via Fluid Compute rather
; than long-lived worker pools; keep this modest and let Vercel handle
; horizontal scaling across instances instead.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

clear_env = no

catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
