worker_processes auto;
daemon off;
# Match php-fpm's pool user (nobody:nobody, socket mode 0660) so workers
# can actually connect to /run/php-fpm.sock -- nginx's Alpine package
# defaults workers to its own compiled-in user otherwise, not whoever
# started the master process.
user nobody nobody;

error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  access_log off;
  sendfile on;
  tcp_nopush on;

  client_max_body_size 25M;
  client_body_temp_path /tmp/nginx/client-body;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  proxy_temp_path /tmp/nginx/proxy;

  map $http_x_forwarded_proto $fastcgi_param_https_variable {
    default '';
    https 'on';
  }

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /opt/blesta/blesta;

    location / {
      try_files $uri /index.php;
      rewrite ^(.*)/install\.php$ /$1/install/ redirect;
    }

    location = /index.php {
      include /etc/nginx/fastcgi.conf;

      fastcgi_pass unix:/run/php-fpm.sock;
      fastcgi_param SERVER_NAME $http_host;
      fastcgi_param SERVER_ADDR $server_addr;
      fastcgi_param SCRIPT_FILENAME $document_root/index.php;
      fastcgi_param SCRIPT_NAME $fastcgi_script_name;
      fastcgi_param HTTPS $fastcgi_param_https_variable if_not_empty;
    }

    # Temporary diagnostic: confirms nginx can reach php-fpm's socket at
    # all, independent of anything Blesta's own index.php does. Remove
    # once the stack is verified end to end.
    location = /fpm-status {
      include /etc/nginx/fastcgi.conf;
      fastcgi_pass unix:/run/php-fpm.sock;
      fastcgi_param SCRIPT_NAME /fpm-status;
    }

    location ~ /\. {
      log_not_found off;
      return 404;
    }

    location ~* \.(php|pdt|txt)$ {
      log_not_found off;
      return 404;
    }
  }
}
