[project]
name = "synelia-testing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "synelia-kernel",
  "httpx>=0.28",
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synelia_testing"]

[tool.uv.sources]
synelia-kernel = { workspace = true }
